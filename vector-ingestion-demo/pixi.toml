[project]
name = "vector-ingestion-demo"
version = "0.1.0"
description = "Demo: Generate security logs with attack patterns, ingest to Snowflake and Splunk via Vector"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tasks]
# Setup tasks
setup = "bash scripts/setup_all.sh"
install-vector = "bash scripts/install_vector.sh"

# PostgreSQL tasks
pg-init = "bash scripts/postgres_init.sh"
pg-start = "pg_ctl -D ./data/postgres -l ./logs/postgres.log start"
pg-stop = "pg_ctl -D ./data/postgres stop"
pg-status = "pg_ctl -D ./data/postgres status"

# Log generation tasks
generate-logs = "python scripts/generate_logs.py"
generate-attack = "python scripts/generate_attack_logs.py"
generate-continuous = "python scripts/continuous_log_generator.py"
generate-all = "python scripts/generate_all_logs.py"

# PostgreSQL attack simulation
pg-attacks = "python scripts/postgres_attacks.py"
pg-suspicious = "python scripts/postgres_suspicious_queries.py"

# Vector tasks
vector-validate = "$HOME/.local/bin/vector validate config/vector.toml"
vector-run = "$HOME/.local/bin/vector --config config/vector.toml"
vector-dry-run = "$HOME/.local/bin/vector --config config/vector.toml --dry-run"

# Web server for log generation
start-server = "python scripts/simple_web_server.py"

# Attack simulation (requires web server running)
run-attacks = "python scripts/attack_simulator.py"

# Snowflake CSV upload (quick alternative to S3/Snowpipe)
upload-csv = "python scripts/upload_to_snowflake.py"
create-snowflake-tables = "python scripts/snowflake_setup.py"

# Combined demo workflow
demo-generate = { depends-on = ["generate-all"] }
demo-live = { depends-on = ["start-server"] }

# Full demo (generate all logs)
full-demo = "python scripts/generate_all_logs.py"

# Quick demo: generate + upload to Snowflake
quick-demo = "python scripts/generate_all_logs.py && python scripts/upload_to_snowflake.py"

[dependencies]
python = ">=3.11"
requests = ">=2.31"
faker = ">=22.0"
rich = ">=13.0"
httpx = ">=0.26"
postgresql = ">=16"
psycopg2 = ">=2.9"
snowflake-connector-python = ">=3.6"
pandas = ">=2.1"

# Development dependencies (uncomment to use)
# [feature.dev.dependencies]
# pytest = ">=7.4"
# black = ">=24.0"

