# Credentials Configuration
# Copy this file to credentials.toml and fill in your values
#
# Usage:
#   cp config/credentials.example.toml config/credentials.toml
#   nano config/credentials.toml

# ==============================================================================
# SNOWFLAKE CONFIGURATION
# ==============================================================================

[snowflake]
# Your Snowflake account identifier (e.g., "abc12345" or "abc12345.us-east-1")
account = "your-account-identifier"

# Snowflake credentials
user = "your-username"
password = "your-password"

# Target database and schema
database = "SECURITY_LAKE"
schema = "LOGS"
warehouse = "COMPUTE_WH"

# S3 staging bucket for Snowpipe (if using S3 method)
s3_bucket = "your-s3-bucket-for-snowflake"
s3_region = "us-east-1"

# ==============================================================================
# SPLUNK CONFIGURATION
# ==============================================================================

[splunk]
# Splunk Cloud HEC endpoint
# Format: https://inputs.YOUR-STACK.splunkcloud.com:8088
endpoint = "https://inputs.your-stack.splunkcloud.com:8088"

# HEC token (create in Splunk: Settings > Data Inputs > HTTP Event Collector)
hec_token = "your-hec-token-here"

# Index to send logs to (must exist in Splunk)
index = "security"

# ==============================================================================
# AWS CONFIGURATION (for S3 staging)
# ==============================================================================

[aws]
# AWS credentials for S3 access
# Leave blank if using IAM roles or instance profiles
access_key_id = ""
secret_access_key = ""
region = "us-east-1"

# ==============================================================================
# OPTIONAL SETTINGS
# ==============================================================================

[settings]
# Enable debug logging
debug = false

# Buffer size in MB
buffer_size_mb = 100

# Batch timeout in seconds
batch_timeout_secs = 60

